[package]
name = "rust_wordchain"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A Korean-friendly word-chain game written in Rust with Slint for Android."

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.17.1", features = ["backend-android-activity-06"] }
rand = "0.9"

[package.metadata.android]
package = "com.example.rustwordchain"
label = "끝말잇기"
apk_name = "rust_wordchain"
build_targets = ["aarch64-linux-android"]
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "끝말잇기"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize"
exported = true
